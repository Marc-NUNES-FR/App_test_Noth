name: Build WP2 App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: thumbv7em-none-eabi
          components: llvm-tools-preview

      - name: Build
        run: |
          cargo build --release -p app_test_noth --target thumbv7em-none-eabi

      - name: Generate .bin
        run: |
          mkdir -p output
          llvm-objcopy -O binary --set-section-flags .data=alloc,load,contents \
            target/thumbv7em-none-eabi/release/app_test_noth \
            output/app_test_noth.bin

      - name: Upload .bin
        uses: actions/upload-artifact@v4
        with:
          name: app_test_noth.bin
          path: output/app_test_noth.bin
